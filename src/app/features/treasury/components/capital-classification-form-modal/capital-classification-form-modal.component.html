<app-modal
  [open]="open()"
  [title]="title()"
  size="md"
  [closeOnBackdrop]="!submitting()"
  [closeOnEsc]="!submitting()"
  (closed)="close()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate autocomplete="off">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">اسم التصنيف <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [attr.maxlength]="NAME_MAX"
          placeholder="مثال: رأس مال التأسيس"
        />
        <app-form-error [control]="form.controls.name" label="اسم التصنيف" />
      </div>

      <div class="col-12">
        <label class="form-label d-flex justify-content-between">
          <span>ملاحظات</span>
          <span style="color:var(--txt3);font-size:10px">{{ form.controls.notes.value.length }} / {{ NOTES_MAX }}</span>
        </label>
        <textarea
          class="form-control"
          rows="3"
          formControlName="notes"
          [attr.maxlength]="NOTES_MAX"
          placeholder="(اختياري)"
        ></textarea>
        <app-form-error [control]="form.controls.notes" label="الملاحظات" />
      </div>
    </div>

    @if (serverError(); as msg) {
      <div class="alert alert-danger mt-3 mb-0" role="alert" style="font-size:11px;">{{ msg }}</div>
    }
  </form>

  <ng-container modal-footer>
    <button type="button" class="btn" [disabled]="submitting()" (click)="close()">إلغاء</button>
    <button
      type="button"
      class="btn btn-bl d-inline-flex align-items-center gap-2"
      [disabled]="submitting() || form.invalid"
      (click)="submit()"
    >
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
      }
      <span>{{ submitting() ? 'جاري الحفظ...' : (isCreate() ? 'إضافة' : 'حفظ التعديل') }}</span>
    </button>
  </ng-container>
</app-modal>
