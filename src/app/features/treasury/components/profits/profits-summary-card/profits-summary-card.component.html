@let s = summary();

<ng-template #term let-label="label" let-value="value" let-field="field" let-strong="strong" let-tone="tone">
  <div class="ps-term" [class.ps-term-strong]="strong" [class.ps-term-expense]="tone === 'expense'">
    <span class="ps-term-label">
      {{ label }}
      <app-profit-info [field]="field" />
    </span>
    <span class="ps-term-value" [class.ps-loss]="value < 0">{{ value | amountAr }}</span>
  </div>
</ng-template>

<section class="ps-card" aria-labelledby="ps-summary-title">
  <h2 id="ps-summary-title" class="ps-head">الأرباح</h2>

  <dl class="ps-grid">
    <div class="ps-pair">
      <dt>
        الأرباح الكلية
        <app-profit-info field="TotalProfits" />
      </dt>
      <dd [class.ps-loss]="s.totalProfits < 0">{{ s.totalProfits | amountAr }}</dd>
    </div>
    <div class="ps-pair">
      <dt>
        الأرباح الموزعة
        <app-profit-info field="DistributedProfits" />
      </dt>
      <dd [class.ps-loss]="s.distributedProfits < 0">{{ s.distributedProfits | amountAr }}</dd>
    </div>
    <div class="ps-pair">
      <dt>
        الأرباح الحالية
        <app-profit-info field="CurrentProfits" />
      </dt>
      <dd [class.ps-loss]="s.currentProfits < 0">{{ s.currentProfits | amountAr }}</dd>
    </div>
  </dl>

  <div class="ps-equation" role="group" aria-label="معادلة صافي الأرباح">
    <ng-container
      *ngTemplateOutlet="term; context: { label: 'الأرباح المحصلة', value: s.collectedProfits, field: 'CollectedProfits' }"
    />
    <span class="ps-op" aria-label="زائد">+</span>
    <ng-container
      *ngTemplateOutlet="term; context: { label: 'الإيرادات المباشرة', value: s.directRevenues, field: 'DirectRevenues' }"
    />
    <span class="ps-op" aria-label="ناقص">−</span>
    <ng-container
      *ngTemplateOutlet="term; context: { label: 'المصروفات', value: s.expenses, field: 'Expenses', tone: 'expense' }"
    />
    <span class="ps-op" aria-label="يساوي">=</span>
    <ng-container
      *ngTemplateOutlet="term; context: { label: 'صافي الأرباح', value: s.netProfits, field: 'NetProfits', strong: true }"
    />
  </div>
</section>
